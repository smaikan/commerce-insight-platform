services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eleven_sqlserver
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: eleven_redis
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: eleven_api
    ports:
      - "127.0.0.1:3300:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - ./API/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - GuestProtection__Redis__ConnectionString=redis:6379
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ECommerceDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ENABLE_DEVELOPMENT_SEED=true
      - SEED_ADMIN_EMAIL=admin@eleven.com
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=Eleven
      - Jwt__Audience=ElevenClient
      - Email__Smtp__Password=${SMTP_PASSWORD}
      - ContactPrivacy__NoticeVersion=2026-08-v1
      - ContactPrivacy__NoticePublishedAtUtc=2026-08-21T00:00:00Z
      - ContactPrivacy__RetentionDays=60
      - DataProtection__KeyRingPath=/var/eleven/dataprotection-keys
      - StorefrontRevalidation__Enabled=true
      - StorefrontRevalidation__BaseUrl=http://storefront-ui:3000
      - StorefrontRevalidation__Secret=${STOREFRONT_REVALIDATE_SECRET:?STOREFRONT_REVALIDATE_SECRET must be set in the root .env file}
    volumes:
      - dataprotection_keys:/var/eleven/dataprotection-keys

  admin-ui:
    build:
      context: .
      dockerfile: UI/admin/Dockerfile
    container_name: eleven_admin
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    env_file:
      - ./UI/admin/.env
    environment:
      - NODE_ENV=production
      - INTERNAL_API_BASE_URL=http://api:8080
      - BROWSER_API_BASE_URL=https://api.serhateleven.com.tr
      - ADMIN_APP_ORIGIN=https://admin.serhateleven.com.tr

  storefront-ui:
    build:
      context: .
      dockerfile: UI/storefront/Dockerfile
    container_name: eleven_storefront
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    env_file:
      - ./UI/storefront/.env
    environment:
      - NODE_ENV=production
      - INTERNAL_API_BASE_URL=http://api:8080
      - BROWSER_API_BASE_URL=https://api.serhateleven.com.tr
      - STOREFRONT_APP_ORIGIN=https://www.serhateleven.com.tr
      - STOREFRONT_REVALIDATE_SECRET=${STOREFRONT_REVALIDATE_SECRET:?STOREFRONT_REVALIDATE_SECRET must be set in the root .env file}

volumes:
  sqlserver_data:
  dataprotection_keys:
