services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eleven_sqlserver
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: eleven_api
    ports:
      - "3300:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ECommerceDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ENABLE_DEVELOPMENT_SEED=true
      - SEED_ADMIN_EMAIL=admin@eleven.com
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=Eleven
      - Jwt__Audience=ElevenClient
      - Email__Smtp__Password=${SMTP_PASSWORD}

  admin-ui:
    build:
      context: .
      dockerfile: UI/admin/Dockerfile
    container_name: eleven_admin
    ports:
      - "3001:3001"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - INTERNAL_API_BASE_URL=http://api:8080
      - BROWSER_API_BASE_URL=http://localhost:3300
      - ADMIN_APP_ORIGIN=http://localhost:3001

  storefront-ui:
    build:
      context: .
      dockerfile: UI/storefront/Dockerfile
    container_name: eleven_storefront
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - INTERNAL_API_BASE_URL=http://api:8080
      - BROWSER_API_BASE_URL=http://localhost:3300
      - STOREFRONT_APP_ORIGIN=http://localhost:3000

volumes:
  sqlserver_data:
