<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İade Durumu Güncellendi</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f0f4f8; color: #333333; -webkit-font-smoothing: antialiased;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #f0f4f8; padding: 40px 10px;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05); overflow: hidden; max-width: 100%;">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="background-color: #0b0f19; padding: 36px 20px;">
                            {{LogoHtml}}
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px 30px;">
                            <h1 style="margin-top: 0; margin-bottom: 25px; font-size: 26px; color: #0056b3; text-align: center; font-weight: 700;">İade Durumunuz Güncellendi</h1>
                            <p style="font-size: 16px; line-height: 1.8; margin-bottom: 15px;">Merhaba <strong>{{RecipientName}}</strong>,</p>
                            <p style="font-size: 16px; line-height: 1.8; margin-bottom: 35px; color: #4a5568;"><strong>{{OrderNumber}}</strong> numaralı siparişinizdeki <strong>{{ReturnNumber}}</strong> numaralı iade talebinizin durumu güncellendi.</p>
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8faff; border: 1px solid #d1e0ff; border-radius: 8px; margin-bottom: 35px;">
                                <tr>
                                    <td style="padding: 25px; text-align: center;">
                                        <p style="margin: 0 0 8px 0; font-size: 14px; color: #718096; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Yeni İade Durumu</p>
                                        <p style="margin: 0; font-size: 22px; font-weight: bold; color: #0056b3;">{{Status}}</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f7fafc; padding: 25px; text-align: center; border-top: 1px solid #edf2f7;">
                            <p style="margin: 0 0 10px 0; font-size: 14px; color: #a0aec0;">Bizi tercih ettiğiniz için teşekkür ederiz.</p>
                            <p style="margin: 0; font-size: 16px; font-weight: bold; color: #4a5568;">{{StoreName}}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
